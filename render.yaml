# Render Blueprint: jedan web servis (Next.js + NestJS API) i PostgreSQL baza.
services:
  - type: web
    name: mtto-platform
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node scripts/start.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: mtto-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: urednik@mtto.demo
      - key: ADMIN_NAME
        value: Urednik MTTO
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: mtto-db
    plan: free
    region: frankfurt
    databaseName: mtto_db
    user: mtto_db_user
    postgresMajorVersion: "16"
