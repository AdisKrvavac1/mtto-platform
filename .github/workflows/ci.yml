name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: mtto
          POSTGRES_PASSWORD: mtto
          POSTGRES_DB: mtto
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mtto" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://mtto:mtto@localhost:5432/mtto
      JWT_SECRET: ci-only-secret-ci-only-secret-0000000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: API – build i testovi
        run: npm test -w apps/api
      - name: API – migracije na praznoj bazi (dvaput, druga ne smije ništa mijenjati)
        run: node -e "const {Pool}=require('pg');const {migrate}=require('./apps/api/dist/migrations');const p=new Pool({connectionString:process.env.DATABASE_URL});migrate(p).then(()=>migrate(p)).then(()=>p.query('SELECT count(*)::int n FROM schema_migrations')).then(r=>{console.log('migracija:',r.rows[0].n);if(r.rows[0].n<3)process.exit(1)}).then(()=>p.end())"
      - name: API – tipovi baze su ažurni
        run: npm run db:types -w apps/api -- --url "$DATABASE_URL" && git diff --exit-code apps/api/src/db-types.ts
      - name: Dizajn sistem – tokeni su generisani iz tokens.json
        run: npm run tokens -w packages/ui && git diff --exit-code packages/ui/src/tokens
      - name: Dizajn sistem – tipovi i axe nad svim pričama (jsdom)
        run: npx tsc --noEmit -p packages/ui && npm test -w packages/ui
      - name: Dizajn sistem – Storybook build i axe u Chromiumu (kontrast)
        run: |
          npm run build-storybook -w packages/ui
          npx playwright-core install --with-deps chromium
          npm run test:browser -w packages/ui
      - name: Storybook kao artefakt (za pregled)
        uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: packages/ui/storybook-static
          retention-days: 14
      - name: Web – provjera tipova
        run: npx tsc --noEmit -p apps/web
      - name: Web – produkcijski build
        run: npm run build -w apps/web
      - name: Ranjivosti u zavisnostima (produkcija)
        run: npm audit --omit=dev --audit-level=high
